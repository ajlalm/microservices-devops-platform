services:
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "5001:5001"

  task-service:
    build: ./services/task-service
    container_name: task-service
    ports:
      - "5002:5002"

  nginx-gateway:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - task-service