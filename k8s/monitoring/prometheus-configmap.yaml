apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "auth-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["auth-service:5001"]

      - job_name: "task-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["task-service:5002"]
